name: Release CI/CD

on:
  push:
    branches:
      - release
    paths:
      - "src/**"
      - "test/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check formatting with Ruff
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy src

  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/release'

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest -c test/pytest.ini -q --cov=templisafe --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/release'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.5.0" "twine>=7.0.0"

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: templisafe-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create tag and GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/release'
    permissions:
      contents: write
    outputs:
      created: ${{ steps.created.outputs.created }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read project version
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          tag_name = f"v{version}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag_name={tag_name}\n")
          PY

      - name: Fail if tag already exists
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Bump project.version before releasing."
            exit 1
          fi

      - name: Create and push tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: templisafe-dist
          path: dist/

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: templisafe ${{ steps.version.outputs.version }}
          body: Release ${{ steps.version.outputs.tag_name }}
          files: dist/*

      - name: Mark release as created
        id: created
        run: echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/release' && needs.release.outputs.created == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/templisafe/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: templisafe-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
