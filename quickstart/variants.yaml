params:
  all_ages:                       # parameterization 1
    select_columns:
      - u.id
      - u.name
      - u.age
      - m.value

    user_join_key: id
    metric_join_key: user_id
    # user_codes -> defaulted
      
    # user_age_lower -> defaulted
    # user_age_upper -> defaulted
    user_status: ACTIVE

    # metric_code -> defaulted
    metric_updated_flag: true
    metric_threshold: 54.12

  limited_ages:                   # parameterization 2
    select_columns:
      - u.id
      - u.name
      - u.age
      - m.value

    user_join_key: id
    metric_join_key: user_id
    # user_codes -> defaulted
      
    user_age_lower:  18
    user_age_upper: 70
    user_status: ACTIVE

    # metric_code -> defaulted
    metric_updated_flag: true
    metric_threshold: 54.12