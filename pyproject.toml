[build-system]
# Use setuptools and wheel as the build backend
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "templisafe"
version = "0.1.0"
description = """
    Templisafe is a flexible, engine and configuration agnostic library for safe templating. 
    It supports any template engine (Jinja is used by default) and configuration format 
    (YAML, JSON, TOML, XML, ...), automatically generating schemas for template variables 
    using Pydantic and validating parameterizations.

    Templisafe handles multiple sources concurrently using threading (if enabled), while 
    also supporting serial processing when needed. Its core idea is to enable Template-As-Code 
    (TaC), providing an IaC-like approach to managing templates safely and systematically 
    with a fully configurable and easy-to-use API.
"""

readme = "README.md"
authors = [{name = "Mattia Volpato"}]
license = {text = "MIT"}
requires-python = ">=3.11"

# Runtime dependencies
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.0",
    "pydantic>=2.0",
    "overrides>=7.3",
    "requests",
    "aiohttp",
    "tenacity"
]

# Optional development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock",
    "requests-mock",
    "pytest-asyncio",
    "aresponses",
    "black",
    "isort",
    "mypy",
    "Django>=4.2",
    "moto[s3, secretsmanager, ssm, dynamodb]"           # Enables mocking for aws services
]
notebook = [
    "notebook>=7.0",          # Jupyter Notebook
    "jupyterlab>=4.0",        # JupyterLab interface (optional)
    "ipykernel>=6.0",         # Kernel for running Python
]
s3 = [
    "boto3>=1.30",
]

[tool.setuptools]
# Include packages under src/
packages = {find = {where = ["src"]}}