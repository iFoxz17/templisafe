[build-system]
# Use setuptools and wheel as the build backend
requires = ["setuptools>=80.9.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "templisafe"
version = "0.1.0"
description = "Safe, flexible and fully configurable templating for Python."

readme = "README.md"
authors = [
    { name = "Mattia Volpato", email = "volpato.mattia.2001@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11"

# Runtime dependencies
dependencies = [
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "overrides>=7.7.0",
    "requests>=2.32.5",
    "aiohttp>=3.13.3",
    "tenacity>=9.1.2"
]

# Optional development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "requests-mock>=1.12.1",
    "pytest-asyncio>=1.3.0",
    "aresponses>=3.0.0",
    "ruff>=0.16.3",
    "pre-commit>=4.0.0",
    "mypy>=1.19.1",
    "types-PyYAML>=6.0.12.20260815",
    "types-requests>=2.33.0.20260712",
    "build>=1.5.0",
    "twine>=7.0.0",
    "Django>=4.2",
    "moto[s3, secretsmanager, ssm, dynamodb]>=5.1.20"           # Enables mocking for aws services
]
notebook = [
    "notebook>=7.5.2",          # Jupyter Notebook
    "jupyterlab>=4.5.2",        # JupyterLab interface (optional)
    "ipykernel>=7.1.0",         # Kernel for running Python
]
s3 = [
    "boto3>=1.42.30",
]

[tool.setuptools]
# Include packages under src/
packages = {find = {where = ["src"]}}

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]
ignore = ["E402", "F403", "F405", "F541", "F841", "F842"]

[tool.ruff.format]
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"src/templisafe/__init__.py" = ["F401", "F403"]
"src/templisafe/settings/__init__.py" = ["F401", "F403"]
"src/templisafe/settings/source/__init__.py" = ["F401", "F403"]
"src/templisafe/source/__init__.py" = ["F401", "F403"]
"src/templisafe/source/aws/__init__.py" = ["F401", "F403"]
"src/templisafe/template/__init__.py" = ["F401", "F403"]

[tool.mypy]
python_version = "3.11"
